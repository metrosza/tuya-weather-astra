yaml
name: Sync Tuya Weather to Astra

on:
  schedule:
    # ตั้งเวลารันอัตโนมัติทุกๆ 15 นาที
    - cron: '*/15 * * * *'
  workflow_dispatch: # เปิดสิทธิ์ให้มีปุ่มกดสั่งรันเองแบบ Manual ได้

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      env:
        TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
        TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
      run: python tuya_to_astra.py
